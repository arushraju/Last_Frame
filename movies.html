<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Last Frame</title>
    <link rel="stylesheet" href="./style.css">

    
</head>
<body>
    <!--Main Content-->
    <div class="container">
        <!--Map container-->
        <div class="concept map-container">

            <!--Movie 1 - Jobs (2013)-->
            <div class="movie movie_1">
                <div class="movie-title">Jobs (2013)</div>
                <div class="movie-phrase">Unlike how it felt initially, it was motivaing</div>
            </div>

            <!--Movie 2 - Ford VS Ferrari ()-->
            <div class="movie movie_2">
                <div class="movie-title">Ford VS Ferrari (2013)</div>
                <div class="movie-phrase">It wasnt as good as expected but it felt Okay</div>
            </div>

            <!--Movie 3 - Parasite (2009)-->
            <div class="movie movie_2">
                <div class="movie-title">Parasite (2009)</div>
                <div class="movie-phrase">It was entertaining but had a good story</div>
            </div>
        </div>

        <div class="sub-container">
            <!--Search Bar Container-->
            <div class="concept search-container">

            </div>

            <!--Intoduction Container-->
            <div class="concept intro-container">
                <div class="button-flex">
                    <div class="button how-to-container">
                        <img src="./Popcorn_Image.png">
                    </div>
                    <div class="button food-container">
                        <img src="./Popcorn_Image.png">
                    </div>
                    <div class="button actors-container">
                        <img src="./Popcorn_Image.png">
                    </div>
                    <div class="button favs-container">
                        <img src="./Popcorn_Image.png">
                    </div>
                    <div class="button favs-container">
                        <img src="./Popcorn_Image.png">
                    </div>
                </div>

                <!--Screen Display-->
                <div class="screen-display-container">

                </div>
            </div>
        </div>

        
    </div>

    <!--Pop up-->
    <div class="pop-up-position">
        <div class="pop-up-container">
            <div class="pop-up">
                <div class="cross-container">
                    <div class="cross"></div>
                </div>
                <div class="title"></div>
                <div class="content"></div>
            </div>
        </div>
    </div>

    <!--French Fries Boundary-->
    <div class="french-fries-container"></div>

    <!--Projector-->
    <div class="projector-position"></div>

    <!--Notice Board-->
    <div class="notice-board-position">
        <img class="" src="./Notice_Board.png">
        <div class="notice-content-container">
            <div class="notice-content">
                <p>This is the Content of the Notice Board</p>
            </div>
        </div>
    </div>

    <!--Loading Page-->
    <div class="loading-page-container">
        <div class="loading-page-position">
            <img class="Loading_Image Image_1" src="./Face_Images/1.png">
            <img class="Loading_Image Image_2" src="./Face_Images/2.png">
            <img class="Loading_Image Image_3" src="./Face_Images/3.png">
            <img class="Loading_Image Image_4" src="./Face_Images/4.png">
            <img class="Loading_Image Image_5" src="./Face_Images/5.png">
            <img class="Loading_Image Image_6" src="./Face_Images/6.png">
            <img class="Loading_Image Image_7" src="./Face_Images/7.png">
            <img class="Loading_Image Image_8" src="./Face_Images/8.png">
        
            <div class="slice1 slice">
                <img src="./Movies_images/Dark_image.jpg">
            </div>
            <div class="slice2 slice">
                <img src="./Movies_images/Parasite_Movie_image.jfif">
            </div>
            <div class="slice3 slice">
                <img src="./Movies_images/Ford_Vs_Ferrari_image.jfif">
            </div>
            <div class="slice4 slice">
                <img src="./Movies_images/Ford_Vs_Ferrari_image.jfif">
            </div>
            <div class="slice5 slice">
                <img src="./Movies_images/Rush_Collage.jfif">
            </div>
            <div class="slice6 slice">
                <img src="./Movies_images/Martian_image.jfif">
            </div>
            <div class="slice7 slice">
                <img src="./Movies_images/Odyesses_Image.jfif">
            </div>
            <div class="slice8 slice">
                <img src="./Movies_images/The_Secret_life_of_walter_mitty_image.jfif">
            </div>
        </div>
    </div>

    <!--Last Frames Logo-->
    <div class="logo">

    </div>


    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.10.4/gsap.min.js"></script>
    <script src="./script.js"></script>
</body>
</html>
